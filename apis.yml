name: Capriza
description: Capriza was an enterprise mobility software company founded in 2011 in Palo Alto,
  California, backed by a16z and others across roughly $73.5M in funding. Its platform took a
  no-code approach to mobilizing workflows from legacy enterprise applications such as SAP, Oracle
  and PeopleSoft by driving their existing user interfaces, explicitly WITHOUT requiring APIs, new
  infrastructure or custom code. The company has permanently closed and never published a public API
  surface, so this record is retained as a historical network entry rather than an enrichable
  provider profile.
