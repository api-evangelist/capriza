  titled "Discover Top Tracking Apps, Lifestyle Tips, and Relationships Advices";
  /.well-known/security.txt soft-404s (302) to that homepage and is NOT a real
  security.txt; support.capriza.com and api./developer.capriza.com return NXDOMAIN;
  the github.com/Capriza org now returns 404 (it held only a profile-config repo on
  the 2026-07-18 pass). Search hits for Capriza API docs resolve to stale index
  entries for the dead support host or to the unrelated Capri AI product. No API,
  no artifacts to enrich; do not wire link pointers at capriza.com, which is now
  third-party content.'
